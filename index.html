<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スペイン語">
<meta name="mobile-web-app-capable" content="yes">
<title>スペイン語 話せる帳</title>
<style>
  :root{
    --bg:#fbf8f3; --card:#ffffff; --ink:#1f1f1f; --muted:#6a645c; --line:#e5ded3;
    --red:#b3261e; --red-soft:#fbe9e7; --gold:#f1bf00; --gold-soft:#fff6dc; --blue:#1d5fa8;
    --ok:#1e7a46; --ok-soft:#e6f4ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150f; --card:#221f18; --ink:#f2eee6; --muted:#a8a092; --line:#3a352b;
      --red:#ff8a80; --red-soft:#3a1f1c; --gold:#f1bf00; --gold-soft:#332b10; --blue:#7fb2ee;
      --ok:#5fd08e; --ok-soft:#12301f;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  header{padding:calc(14px + env(safe-area-inset-top)) 0 6px}
  .flag{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:10px}
  .flag i{flex:1;background:var(--red)} .flag i:nth-child(2){flex:2;background:var(--gold)}
  h1{font-size:22px;margin:0 0 2px} h2{font-size:17px;margin:18px 0 6px}
  .sub{color:var(--muted);font-size:13px}
  .nav{display:flex;gap:6px;margin:10px 0 4px}
  .nav button{flex:1;padding:10px 4px;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
  .nav button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px;margin:0 -16px;border-bottom:1px solid var(--line)}
  input[type=search],input[type=date]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 14px;font-size:14px}
  .tab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  .opts{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .opts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}
  .opts button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
  .ja{font-size:14px;color:var(--muted)} .es{font-size:20px;font-weight:700;margin:2px 0} .kana{font-size:15px;color:var(--red)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1;font-size:14px;padding:11px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .row .play{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .row .mic{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .row .fav[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
  .res{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
  .res:empty{display:none}
  .res.ok{background:var(--ok-soft);border-color:var(--ok)} .res.near{background:var(--gold-soft);border-color:var(--gold)} .res.ng{background:var(--red-soft);border-color:var(--red)}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .tip{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}
  .big-btn{display:block;width:100%;padding:15px;font-size:18px;font-weight:700;border-radius:12px;border:none;background:var(--red);color:#fff;margin:10px 0}
  .btn2{padding:10px 14px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .count{display:flex;gap:10px;margin:10px 0}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--red)} .stat span{font-size:12px;color:var(--muted)}
  .meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
  .meter i{display:block;height:100%;background:var(--ok)}
  details.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px}
  details.wk summary{padding:12px 0;font-weight:700;cursor:pointer}
  details.wk[open] summary{border-bottom:1px solid var(--line)}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 6px}
  .dbtn{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;line-height:1.2}
  .dbtn.done{background:var(--ok-soft);border-color:var(--ok)} .dbtn.today{border:2px solid var(--red)} .dbtn small{display:block;color:var(--muted);font-size:10px}
  .q{font-size:20px;font-weight:700;margin:10px 0} .qsub{color:var(--muted);font-size:13px}
  .choice{display:block;width:100%;text-align:left;font-size:17px;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .choice.right{border-color:var(--ok);background:var(--ok-soft)} .choice.wrong{border-color:var(--red);background:var(--red-soft)}
  .fb{font-size:16px;font-weight:700;margin:10px 0}
  .fb.ok{color:var(--ok)} .fb.ng{color:var(--red)}
  .log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  .log summary{cursor:pointer}
  .wr{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  #big{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  #big.on{display:flex} #big .es{font-size:36px;margin:12px 0} #big .ja{font-size:18px}
  #big button{margin-top:22px;font-size:18px;padding:14px 30px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  #big .play{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .nov{display:none;color:var(--red);font-size:13px;margin:6px 0}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <div class="flag"><i></i><i></i><i></i></div>
  <h1>スペイン語 話せる帳</h1>
  <div class="sub">出発（2月20日）までの学習コース ＋ 会話集</div>
  <div class="nav" id="nav">
    <button data-v="learn">学習</button><button data-v="book">会話集</button><button data-v="log">ふりかえり</button>
  </div>
</header>

<main id="v-learn"></main>

<main id="v-book" class="hide">
  <div class="bar">
    <input type="search" id="q" placeholder="さがす（例：トイレ、会計、ありがとう）" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="opts"><button id="slow" aria-pressed="true">ゆっくり読む</button><span id="count"></span></div>
  <div class="nov" id="nov">この端末にスペイン語の音声が見つかりません。iPhoneの「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → スペイン語」で音声を追加してください。</div>
  <div class="tip">📱 音が出ないときは、iPhone横のマナースイッチ（消音）をオフにして、音量を上げてください。<br>🎤 「話す」でスペイン語を言うと、聞き取れた内容をお手本と比べて判定します（発音の点数ではなく「通じるか」の目安）。</div>
  <div id="list"></div>
</main>

<main id="v-log" class="hide"></main>
<main id="v-quiz" class="hide"></main>

<div id="big" role="dialog" aria-modal="true">
  <div class="ja" id="bigja"></div><div class="es" id="bigeo"></div><div class="kana" id="bigkana"></div>
  <button class="play" id="bigplay">▶ 聞かせる</button><button id="bigclose">閉じる</button>
</div>

const ITEMS = [];

function dayInfo(day){return {w:Math.floor((day-1)/7)+1,d:(day-1)%7}}
function weekItems(w){return ITEMS.filter(i=>i.w===w)}
function learnedUpTo(w){return ITEMS.filter(i=>i.w&&i.w<=w)}
function lessonNew(day){
  const {w,d}=dayInfo(day); if(d===6)return [];
  const arr=weekItems(w); if(!arr.length)return [];
  const per=Math.ceil(arr.length/6); return arr.slice(d*per,(d+1)*per);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stripF(s){return s.replace("（女性が言う）","").replace("（妻が言う）","")}
function makeQ(it,type,pool){
  const useJa=(type==="listen"||type==="rev");
  const key=useJa?"ja":"es";
  const others=shuffle(pool.filter(o=>o.es!==it.es&&stripF(o.ja)!==stripF(it.ja)&&o[key]!==it[key]));
  const wrong=[];const seen=new Set([it[key]]);
  for(const o of others){if(!seen.has(o[key])){seen.add(o[key]);wrong.push(o)}if(wrong.length===3)break}
  const choices=shuffle([it,...wrong]);
  return {type,it,choices,ans:choices.indexOf(it),key};
}
function buildQuiz(day,miss){
  const {w,d}=dayInfo(day);const news=lessonNew(day);const pool=learnedUpTo(w);
  const qs=[];const add=(it,t)=>qs.push(makeQ(it,t,pool));
  if(news.length){
    news.forEach(it=>{add(it,"listen");add(it,"read")});
    const prev=shuffle(pool.filter(i=>!news.includes(i))).sort((a,b)=>((miss&&miss[b.es])||0)-((miss&&miss[a.es])||0));
    prev.slice(0,Math.max(0,10-qs.length)).forEach((it,i)=>add(it,i%2?"listen":"read"));
  }else{
    const wk=shuffle(weekItems(w)).slice(0,10);
    const rest=shuffle(pool.filter(i=>i.w!==w)).slice(0,6);
    wk.concat(rest).forEach((it,i)=>add(it,["listen","read","rev"][i%3]));
    if(!qs.length)pool.slice(0,10).forEach((it,i)=>add(it,["listen","read","rev"][i%3]));
  }
  return shuffle(qs).slice(0,14);
}
function buildMissQuiz(miss){
  const list=ITEMS.filter(i=>(miss[i.es]||0)>0).sort((a,b)=>miss[b.es]-miss[a.es]).slice(0,10);
  const pool=ITEMS.filter(i=>i.w);
  return shuffle(list.map((it,i)=>makeQ(it,["listen","read","rev"][i%3],pool)));
}
function isoToday(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)}
function addDays(iso,n){const t=new Date(iso+"T00:00:00");t.setDate(t.getDate()+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}

function tone(f,t0,dur,type,vol){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}

/* ===== 話して判定 ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUMW={0:"cero",1:"uno",2:"dos",3:"tres",4:"cuatro",5:"cinco",6:"seis",7:"siete",8:"ocho",9:"nueve",10:"diez",20:"veinte",50:"cincuenta",100:"cien"};
function norm(s){
  s=s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:\/]/g," ");
  s=s.replace(/\b\d+\b/g,m=>NUMW[+m]||m);
  return s.replace(/\s+/g," ").trim();
}
function sim(a,b){
  if(!a||!b)return 0;
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1-d[m][n]/Math.max(m,n);
}
function listen(target,res,done){
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  if(standalone){res.className="res ng";res.textContent="ホーム画面から開いたアプリ型では、iPhoneの仕様でマイク判定が使えません。Safariでこのページのアドレスを直接開いてください（読み上げ ▶ はこのままでOK）。";return}
  if(!SR){res.className="res ng";res.textContent="この端末（ブラウザ）では音声認識が使えません。iPhoneのSafariで開いてください。";return}
  try{speechSynthesis.cancel()}catch(e){}
  const targets=target.split(" / ").map(norm);
  if(window.__rec){try{window.__rec.abort()}catch(e){}window.__rec=null}
  const r=new SR();window.__rec=r;r.lang="es-ES";r.continuous=false;r.interimResults=true;r.maxAlternatives=3;
  res.className="res near";res.textContent="🎤 聞いています…スペイン語でどうぞ";
  let got=false,failed=false,started=false,live="";
  const timer=setTimeout(()=>{try{r.stop()}catch(e){}},9000);
  r.onstart=()=>{started=true};
  r.onaudiostart=()=>{res.textContent="🎤 マイクは動いています。スペイン語でどうぞ…"};
  r.onspeechstart=()=>{res.textContent="🎤 声を検知しました…"};
  const judge=alts=>{
    let best=0,heard=alts[0]||"";
    alts.forEach(t=>targets.forEach(g=>{const s=sim(norm(t),g);if(s>best){best=s;heard=t}}));
    const pct=Math.round(best*100);
    if(best>=0.85){res.className="res ok";res.textContent="◎ 通じます！（一致 "+pct+"%）　聞き取り：「"+heard+"」";sfx(true)}
    else if(best>=0.6){res.className="res near";res.textContent="○ おしい！もう一度（一致 "+pct+"%）　聞き取り：「"+heard+"」"}
    else{res.className="res ng";res.textContent="△ もう一度、ゆっくり（一致 "+pct+"%）　聞き取り：「"+heard+"」";sfx(false)}
    if(done)done();
  };
  r.onresult=e=>{
    const last=e.results[e.results.length-1];live=last[0].transcript;
    if(!last.isFinal){res.className="res near";res.textContent="🎤 聞き取り中：「"+live+"」";return}
    got=true;judge([...last].map(a=>a.transcript));
  };
  r.onerror=e=>{
    failed=true;res.className="res ng";
    const m={"not-allowed":"マイクが許可されていません。設定→Safari→マイク を確認してください。","service-not-allowed":"音声認識が許可されていません。設定→Siriと検索（またはApple IntelligenceとSiri）と、設定→一般→キーボード→音声入力 をオンにしてください。","no-speech":"声が聞こえませんでした。もう一度どうぞ。","audio-capture":"マイクを使えません。他のアプリがマイクを使っていないか確認してください。","language-not-supported":"スペイン語の音声認識に対応していません。設定→一般→キーボード→音声入力言語 に「スペイン語」を追加してください。","network":"通信エラーです。電波とWi-Fiを確認してください。"};
    res.textContent=(m[e.error]||"うまく聞き取れませんでした。")+"（"+e.error+"）";
  };
  r.onend=()=>{
    clearTimeout(timer);
    if(!got&&!failed){
      if(live)judge([live]);
      else{res.className="res ng";res.textContent=started?"声が認識されませんでした（マイクは動いていました）。もう少し近づいて、ゆっくり言ってみてください。":"音声認識が始まりませんでした。設定→一般→キーボード→音声入力 と Siri がオンか確認してください。"}
    }
  };
  try{r.start()}catch(err){res.className="res ng";res.textContent="マイクを開始できませんでした。（"+err.name+"）"}
}

function bestPct(day){const L=sessionsOf(day);return L.length?Math.max(...L.map(l=>Math.round(l.score/l.total*100))):null}

}

/* ===== レッスン ===== */
function startLesson(day){
  setView("quiz");
  const root=$("#v-quiz");root.innerHTML="";
  const {w,d}=dayInfo(day);const news=lessonNew(day);
  root.appendChild(el('<h2>Day '+day+'　第'+w+'週「'+WEEK_INFO[w].t+'」'+(d===6?"（復習）":"")+'</h2>'));
  if(d===0)root.appendChild(el('<div class="tip">💡 今週のポイント：'+WEEK_INFO[w].tip+'</div>'));
  if(news.length){
    root.appendChild(el('<div class="sub">① 今日の新しいフレーズ。▶で聞いて、🎤で声に出してみましょう。</div>'));
    news.forEach(it=>root.appendChild(makeCard(it)));
  }else{
    root.appendChild(el('<div class="sub">今日は新しいフレーズはありません。これまでの復習クイズです。</div>'));
  }
  const go=el('<button class="big-btn">'+(news.length?"② クイズを始める":"クイズを始める")+'</button>');
  go.onclick=()=>{ac();runQuiz({title:"Day "+day,day:day,qs:buildQuiz(day,P.miss)})};
  root.appendChild(go);
  const back=el('<button class="btn2">← 学習ホームへ</button>');back.onclick=()=>setView("learn");root.appendChild(back);
  window.scrollTo(0,0);
}
function runQuiz(o){
  setView("quiz");
  const root=$("#v-quiz");const qs=o.qs;let i=0,score=0;const wrong=[];
  if(!qs.length){root.innerHTML='<div class="empty">問題がありません</div>';return}
  function showQ(){
    root.innerHTML="";const q=qs[i];
    root.appendChild(el('<div class="sub">'+o.title+'　'+(i+1)+' / '+qs.length+'</div>'));
    root.appendChild(el('<div class="meter"><i style="width:'+Math.round(i/qs.length*100)+'%"></i></div>'));
    let head;
    if(q.type==="listen")head='<div class="q">🔊 聞こえたスペイン語の意味は？</div>';
    else if(q.type==="read")head='<div class="q">「'+q.it.ja+'」をスペイン語で言うと？</div>';
    else head='<div class="q">'+q.it.es+'</div><div class="qsub">この意味は？</div>';
    root.appendChild(el('<div>'+head+'</div>'));
    if(q.type!=="read"){const pb=el('<button class="btn2" style="margin-bottom:6px">🔊 '+(q.type==="listen"?"もう一度聞く":"聞く")+'</button>');pb.onclick=()=>speak(q.it.es);root.appendChild(pb)}
    const box=el('<div></div>');const fb=el('<div></div>');let locked=false;
    q.choices.forEach((c,idx)=>{
      const b=el('<button class="choice"></button>');b.textContent=q.key==="ja"?c.ja:c.es;
      b.onclick=()=>{
        if(locked)return;locked=true;ac();
        const ok=idx===q.ans;
        [...box.children].forEach((x,k)=>{if(k===q.ans)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        sfx(ok);
        if(ok)score++;else wrong.push(q.it.es);
        const m=P.miss;m[q.it.es]=ok?Math.max(0,(m[q.it.es]||0)-1):(m[q.it.es]||0)+1;
        fb.innerHTML="";
        fb.appendChild(el('<div class="fb '+(ok?"ok":"ng")+'">'+(ok?"⭕ 正解！":"❌ 不正解")+'</div>'));
        fb.appendChild(el('<div class="card"><div class="ja">'+q.it.ja+'</div><div class="es">'+q.it.es+'</div><div class="kana">読み：'+q.it.kana+'</div></div>'));
        const nx=el('<button class="big-btn">'+(i+1<qs.length?"次へ →":"結果を見る")+'</button>');
        nx.onclick=()=>{ac();i++;if(i<qs.length)showQ();else finish()};
        fb.appendChild(nx);
        setTimeout(()=>speak(q.it.es),500);
        fb.scrollIntoView({behavior:"smooth",block:"nearest"});
      };
      box.appendChild(b);
    });
    root.appendChild(box);root.appendChild(fb);
    if(q.type==="listen")setTimeout(()=>speak(q.it.es),200);
    window.scrollTo(0,0);
  }
  function finish(){
    P.log.push({day:o.day||0,title:o.title,ts:Date.now(),score:score,total:qs.length,wrong:wrong});save();
    const pct=Math.round(score/qs.length*100);
    if(pct>=80)fanfare();else sfx(pct>=50);
    root.innerHTML="";
    const msg=pct===100?"パーフェクト！🎉":pct>=80?"よくできました！":pct>=50?"あと少し。間違えたところを聞き直そう":"大丈夫、くり返せば覚えます";
    root.appendChild(el('<div class="card" style="text-align:center"><div class="ja">'+o.title+' の結果</div><div class="es" style="font-size:34px">'+score+' / '+qs.length+'</div><div class="kana">'+pct+'%　'+msg+'</div></div>'));
    if(wrong.length){
      root.appendChild(el('<h2>間違えたフレーズ</h2>'));
      [...new Set(wrong)].forEach(es=>{const it=ITEMS.find(x=>x.es===es);if(it)root.appendChild(makeCard(it))});
      const rt=el('<button class="big-btn">間違えた問題だけやり直す</button>');
      const wi=[...new Set(wrong)].map(es=>ITEMS.find(x=>x.es===es)).filter(Boolean);
      rt.onclick=()=>{ac();const pool=ITEMS.filter(x=>x.w);runQuiz({title:o.title+"（やり直し）",day:0,qs:shuffle(wi.map((it,k)=>makeQ(it,["listen","read","rev"][k%3],pool)))})};
      root.appendChild(rt);
    }
    if(o.day&&o.day<TOTAL_DAYS){const nd=el('<button class="btn2" style="margin:6px 6px 0 0">次の日（Day '+(o.day+1)+'）へ</button>');nd.onclick=()=>{ac();startLesson(o.day+1)};root.appendChild(nd)}
    const hm=el('<button class="btn2" style="margin-top:6px">学習ホームへ</button>');hm.onclick=()=>setView("learn");root.appendChild(hm);
    const lg=el('<button class="btn2" style="margin:6px 0 0 6px">ふりかえりを見る</button>');lg.onclick=()=>setView("log");root.appendChild(lg);
    window.scrollTo(0,0);
  }
  showQ();
}

/* ===== ふりかえり ===== */
function renderLog(){
  const root=$("#v-log");root.innerHTML="";
  const done=new Set(P.log.filter(l=>l.day>0).map(l=>l.day));
  const avg=P.log.length?Math.round(P.log.reduce((s,l)=>s+l.score/l.total,0)/P.log.length*100):0;
  root.appendChild(el('<div class="count"><div class="stat"><b>'+P.log.length+'</b><span>クイズ回数</span></div><div class="stat"><b>'+done.size+'</b><span>完了した日</span></div><div class="stat"><b>'+avg+'<small style="font-size:13px">%</small></b><span>平均点</span></div></div>'));
  const weak=ITEMS.filter(i=>(P.miss[i.es]||0)>0).sort((a,b)=>P.miss[b.es]-P.miss[a.es]).slice(0,10);
  root.appendChild(el('<h2>苦手フレーズ</h2>'));
  if(weak.length){
    weak.forEach(it=>root.appendChild(makeCard(it)));
    const wb=el('<button class="big-btn">苦手クイズ（'+weak.length+'問）</button>');
    wb.onclick=()=>{ac();runQuiz({title:"苦手クイズ",day:0,qs:buildMissQuiz(P.miss)})};root.appendChild(wb);
  }else root.appendChild(el('<div class="empty">まだ間違えたフレーズはありません</div>'));
  root.appendChild(el('<h2>日ごとの記録</h2>'));
  if(!P.log.length)root.appendChild(el('<div class="empty">学習するとここに記録されます</div>'));
  [...P.log].reverse().forEach(l=>{
    const t=new Date(l.ts);const pct=Math.round(l.score/l.total*100);
    const det=el('<details class="log"><summary>'+(t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,"0")+':'+String(t.getMinutes()).padStart(2,"0")+'　'+l.title+'　<b>'+l.score+'/'+l.total+'</b>（'+pct+'%）</summary></details>');
    if(l.wrong&&l.wrong.length){
      [...new Set(l.wrong)].forEach(es=>{const it=ITEMS.find(x=>x.es===es);if(!it)return;
        const r=el('<div class="wr"><b></b>　<span class="sub"></span> <button class="btn2" style="padding:4px 10px">▶</button></div>');
        r.querySelector("b").textContent=it.es;r.querySelector("span").textContent=it.ja;r.querySelector("button").onclick=()=>speak(it.es);det.appendChild(r)});
    }else det.appendChild(el('<div class="wr">全問正解！</div>'));
    root.appendChild(det);
  });
}

/* ===== 会話集 ===== */
const cats=["★お気に入り",...DATA.map(d=>d.cat)];let cur="基本";
const tabsEl=$("#tabs"),listEl=$("#list"),qEl=$("#q"),countEl=$("#count");
cats.forEach(c=>{const b=document.createElement("button");b.className="tab";b.textContent=c;b.onclick=()=>{cur=c;qEl.value="";renderBook()};tabsEl.appendChild(b)});
$("#slow").onclick=e=>{slow=!slow;e.currentTarget.setAttribute("aria-pressed",slow)};
function renderBook(){
  const q=qEl.value.trim().toLowerCase();
  [...tabsEl.children].forEach((b,i)=>b.setAttribute("aria-pressed",cats[i]===cur&&!q));
  let rows;
  if(q)rows=ITEMS.filter(r=>(r.ja+r.es+r.kana).toLowerCase().includes(q));
  else if(cur==="★お気に入り")rows=ITEMS.filter(r=>P.favs.includes(r.es));
  else rows=ITEMS.filter(r=>r.cat===cur);
  listEl.innerHTML="";countEl.textContent=rows.length+"件";
  if(!rows.length){listEl.appendChild(el('<div class="empty">'+(cur==="★お気に入り"&&!q?"★を押すと、ここに集まります":"見つかりませんでした")+'</div>'));return}
  rows.forEach(it=>listEl.appendChild(makeCard(it,()=>{if(cur==="★お気に入り"&&!q)renderBook()})));
}
qEl.addEventListener("input",renderBook);

setView("learn");

</script>
